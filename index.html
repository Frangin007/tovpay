    <!-- Photo du hero de l'accueil (balise img rendue par React, même fichier que IMAGES.hero) : préchargée seulement sur l'accueil -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.href = '/images/accueil-enseignante.webp';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Organization et non FinancialService : le service d'avances n'est pas encore ouvert au public. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TOVPAY",
      "url": "https://tovpay.website/",
      "logo": "https://tovpay.website/brand/tovpay-logo.png",
      "description": "TOVPAY, filiale de GROUPE TOV, prépare un service d'avance sur salaire pour les agents publics du Bénin et du Togo. Le service n'est pas encore ouvert.",
      "areaServed": [
        { "@type": "Country", "name": "Bénin" },
        { "@type": "Country", "name": "Togo" }
      ],
      "parentOrganization": {
        "@type": "Organization",
        "name": "GROUPE TOV"
      },
      "email": "dg@tovpay.africa",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lomé",
        "addressCountry": "TG"
      }
    }
